<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perbaikan Cache SITKAW</title><style>body{font-family:Arial,sans-serif;background:#eef3f8;color:#17324d;margin:0;display:grid;place-items:center;min-height:100vh}.box{max-width:560px;margin:20px;background:white;padding:28px;border-radius:16px;box-shadow:0 12px 40px #0002}h1{margin-top:0}button{border:0;border-radius:10px;background:#174f83;color:white;padding:13px 18px;font-weight:700;font-size:16px;cursor:pointer}.muted{color:#60758b;line-height:1.5}</style></head><body><div class="box"><h1>Memperbaiki cache SITKAW</h1><p id="status" class="muted">Menghapus Service Worker dan cache tampilan lama. Data IndexedDB dan data lokal tidak dihapus.</p><button id="go" hidden>Buka SITKAW</button></div><script>(async()=>{const s=document.getElementById('status'),b=document.getElementById('go');try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()))}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)))}s.textContent='Cache tampilan berhasil dibersihkan. SITKAW akan dibuka dengan versi baru.'}catch(e){s.textContent='Pembersihan sebagian selesai: '+(e&&e.message?e.message:e)}b.hidden=false;b.onclick=()=>location.replace('/?v=18.0.9.1&t='+Date.now());setTimeout(()=>b.click(),1200)})();</script></body></html>
