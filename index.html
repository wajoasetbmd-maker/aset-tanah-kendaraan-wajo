  <style>
    :root{--navy:#0b3558;--blue:#0f65a5;--blue2:#eaf4fb;--gold:#d6a82a;--green:#18864b;--red:#bb2d3b;--orange:#d97706;--text:#17212b;--muted:#667788;--line:#d9e2ea;--bg:#f4f7fa;--white:#fff;--shadow:0 8px 28px rgba(20,46,72,.12)}
    *{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,"Arial Narrow",sans-serif;color:var(--text);background:var(--bg)}button,input,select,textarea{font:inherit}.hidden{display:none!important}
    .login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#082a47,#0f65a5 60%,#d6a82a)}
    .login-card{width:min(440px,100%);background:#fff;border-radius:18px;padding:28px;box-shadow:0 24px 60px rgba(0,0,0,.25);text-align:center}.login-logo{width:80px;height:88px;object-fit:contain}.login-card h1{font-size:22px;margin:8px 0 4px}.login-card p{margin:0 0 22px;color:var(--muted)}
    .field{margin-bottom:13px;text-align:left}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px;color:#33485b}.input,.select,.textarea{width:100%;border:1px solid #c9d5df;border-radius:9px;padding:10px 12px;background:#fff;outline:none;transition:.15s}.input:focus,.select:focus,.textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(15,101,165,.12)}.textarea{min-height:78px;resize:vertical}
    .btn{border:0;border-radius:9px;padding:9px 14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:.15s}.btn:hover{transform:translateY(-1px)}.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}.btn-primary{background:var(--blue);color:#fff}.btn-dark{background:var(--navy);color:#fff}.btn-green{background:var(--green);color:#fff}.btn-red{background:var(--red);color:#fff}.btn-gold{background:var(--gold);color:#17212b}.btn-light{background:#eef3f7;color:#263949;border:1px solid #d7e1e9}.btn-sm{padding:6px 9px;font-size:12px}.btn-block{width:100%}
    .app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}.sidebar{background:var(--navy);color:#fff;position:sticky;top:0;height:100vh;padding:15px 12px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:10px;padding:6px 7px 18px;border-bottom:1px solid rgba(255,255,255,.15)}.brand img{width:43px;height:48px;object-fit:contain;background:#fff;border-radius:7px;padding:2px}.brand b{font-size:15px;line-height:1.25}.nav{padding-top:15px;display:grid;gap:5px}.nav button{width:100%;border:0;background:transparent;color:#dfeaf2;padding:11px 12px;text-align:left;border-radius:9px;cursor:pointer;font-weight:700}.nav button:hover,.nav button.active{background:#fff;color:var(--navy)}.sidebar-bottom{margin-top:auto;border-top:1px solid rgba(255,255,255,.15);padding-top:12px}.user-mini{font-size:12px;line-height:1.45;padding:4px 7px 10px;color:#dbe7ef}.user-mini b{display:block;color:#fff;font-size:13px}
    .main{min-width:0}.topbar{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:20}.topbar h2{font-size:19px;margin:0}.content{padding:20px;max-width:none;margin:auto}

<script>
const state = {
  asset: (function(){try{return sessionStorage.getItem('v17_asset')||'KENDARAAN'}catch(e){return 'KENDARAAN'}})(),
  token: '', user: null, bootstrap: null, view: 'dashboard',
  vehiclePage: 1, vehicleSearch: '', vehicleOpd: '',
  letterPage: 1, letterSearch: '', officersCache: [], usersCache: [], vehicleRequestSeq: 0,
  dashboardFilter: '', dashboardFilterLabel: '', dashboardPage: 1, dashboardSearch: '', dashboardRequestSeq: 0
};

// V18.0.8: expose state ke modul JavaScript eksternal (delta sync, identitas, session guard).
window.state = state;

const $ = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const badgeClass = s => 'badge-' + String(s || '').replace(/\s+/g,'-');
const displayDate = iso => { if(!iso) return '-'; const d=new Date(iso+'T00:00:00'); return isNaN(d)?iso:d.toLocaleDateString('id-ID',{day:'2-digit',month:'2-digit',year:'numeric'}); };
const money = v => v === '' || v == null ? '-' : new Intl.NumberFormat('id-ID').format(Number(v)||0);

async function server(fn, ...args){
  const controller=new AbortController();
  const timeout=setTimeout(()=>controller.abort(),120000);
  try{
    const response=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({module:state.asset,fn,args}),signal:controller.signal});
    const text=await response.text();
    let payload;try{payload=JSON.parse(text)}catch(e){throw new Error('Respons server bukan JSON yang valid.')}
    if(!response.ok||!payload.ok)throw new Error(payload?.error?.message||('HTTP '+response.status));
    return payload.data;
  }catch(e){if(e.name==='AbortError')throw new Error('Server terlalu lama merespons. Silakan ulangi.');throw e}
  finally{clearTimeout(timeout)}
}
function withTimeout(promise,ms,message){
  return Promise.race([
    promise,
    new Promise((_,reject)=>setTimeout(()=>reject(new Error(message||'Proses terlalu lama. Silakan coba kembali.')),ms))
  ]);
}
function loading(show,text='Memproses...',percent=18,sub='Mohon tunggu, proses sedang berjalan.'){
  $('loading').classList.toggle('hidden',!show);
  if(show){$('loadingText').textContent=text;$('loadingBar').style.width=Math.max(5,Math.min(100,Number(percent)||18))+'%';$('loadingSub').textContent=sub;}
}
function loadingStep(percent,text,sub){loading(true,text||$('loadingText').textContent,percent,sub||$('loadingSub').textContent)}
function toast(message,type='ok'){ const el=document.createElement('div'); el.className='toast '+type; el.textContent=message; $('toastWrap').appendChild(el); setTimeout(()=>el.remove(),4200); }
function errorText(err){ return err && err.message ? err.message : String(err); }

window.addEventListener('load', async ()=>{

  $('loginForm').addEventListener('submit', handleLogin);
  document.querySelectorAll('.asset-choice').forEach(b=>b.addEventListener('click',()=>setAssetMode(b.dataset.asset)));
  setAssetMode(state.asset); state.token=safeStoreGet('v17_session_'+state.asset);
  if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}
  if(state.token){
    try{ await startApp(); }catch(e){ safeStoreRemove('v17_session_'+state.asset); state.token=''; }
  }
});

async function handleLogin(e){
  e.preventDefault(); $('loginError').classList.add('hidden'); loading(true,'Memeriksa login...');
  try{
    const result=await server('login',$('loginUsername').value,$('loginPassword').value);
    state.token=result.token; safeStoreSet('v17_session_'+state.asset,state.token); await startApp();
  }catch(err){ $('loginError').textContent=errorText(err); $('loginError').classList.remove('hidden'); }
  finally{ loading(false); }
}

async function startApp(){
  loading(true,'Memuat aplikasi...');
  try{
    state.bootstrap=await server('getBootstrap',state.token); state.user=state.bootstrap.user;
    $('loginScreen').classList.add('hidden'); $('appScreen').classList.remove('hidden');
    $('userMiniName').textContent=state.user.name||state.user.username; $('userMiniRole').textContent=state.user.role;
    $('topUser').textContent=state.asset+' · '+(state.user.name||state.user.username)+' · '+state.user.role;
    if(state.asset==='TANAH'){renderLandShell();await landNavigate('dashboard')}else{renderVehicleShell();await navigate('dashboard');if(state.user.mustChange)setTimeout(()=>{toast('Password awal harus segera diganti.','error');openPasswordModal(true)},500)}
  }finally{loading(false)}
}

async function doLogout(){
  loading(true,'Keluar dari aplikasi...',35);
  try{ await server('logout',state.token); }catch(e){}
  finally{safeStoreRemove('v17_session_'+state.asset);location.reload();}
}

async function navigate(view){
  if(['officers','users','settings'].includes(view) && state.user.role!=='ADMIN') return;
  state.view=view; document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));
  const titles={dashboard:'Dashboard',vehicles:'Data Kendaraan',letters:'Riwayat Surat',officers:'Master Pejabat',users:'Pengguna',settings:'Pengaturan'};
  $('pageTitle').textContent=titles[view]||'Aplikasi';
  loading(true,'Memuat '+(titles[view]||'halaman')+'...',12);
  try{
    if(view==='dashboard') await loadDashboard();
    if(view==='vehicles'){ state.vehiclePage=1; await loadVehicles(); }
    if(view==='letters'){ state.letterPage=1; await loadLetters(); }
    if(view==='officers') await loadOfficers();
    if(view==='users') await loadUsers();
    if(view==='settings') await loadSettings();
  }finally{loading(false)}
}

async function loadDashboard(){
  renderDashboard();
  try{
    state.bootstrap.dashboard=await server('getDashboard',state.token);
    if(state.view==='dashboard'){
      renderDashboard();
      if(state.dashboardFilter)await fetchDashboardVehicles(false);
    }
  }catch(e){
    if(state.view==='dashboard')$('content').innerHTML=`<div class="danger">${esc(errorText(e))}</div>`;
  }
}

function renderDashboard(){
  const d=state.bootstrap.dashboard;
  if(!d){$('content').innerHTML='<section class="panel" style="margin-top:0"><div class="empty">Memuat ringkasan dashboard...</div></section>';return}
  const typeCards=(d.vehicleTypes||[]).map((t,i)=>typeCard(t.type,t.total,i)).join('');
  const usageCards=(d.usageStatuses||[]).map((x,i)=>usageCard(x.status,x.total,i)).join('');
  const filterPanel=state.dashboardFilter?`
    <section class="panel dashboard-result" id="dashboardFilterPanel">
      <div class="panel-head">
        <div class="dashboard-filter-title"><h3>${esc(state.dashboardFilterLabel||'Data Kendaraan')}</h3><span class="badge badge-AKTIF">10 / halaman</span></div>
        <div class="toolbar">
          <input id="dashboardSearch" class="input" style="min-width:310px" placeholder="Cari jenis, merk, OPD, polisi, rangka, mesin, BPKB..." value="${esc(state.dashboardSearch)}">
          <button id="dashboardSearchBtn" class="btn btn-light" onclick="applyDashboardSearch()">Cari</button>
          <button class="btn btn-light" onclick="closeDashboardFilter()">Tutup</button>
        </div>
      </div>
      <div id="dashboardVehicleTable"><div class="empty">Memuat data kendaraan...</div></div>
    </section>`:
    `<section class="panel"><div class="panel-body dashboard-tip"><div><b>Pintasan Data Kendaraan</b><div class="muted" style="margin-top:4px">Klik salah satu kartu untuk melihat 10 data per halaman, mencari kendaraan, mengedit data, atau langsung membuat surat.</div></div><button class="btn btn-light btn-sm" onclick="refreshDashboard()">↻ Muat Ulang</button></div></section>`;

  $('content').innerHTML=`
    <div class="cards">
      ${statCard('Total Kendaraan',d.total,'total','ALL')}
      ${statCard('STNK Aktif',d.active,'active','AKTIF')}
      ${statCard('STNK Mati',d.expired,'expired','MATI')}
      ${statCard('Data Baru',d.newData,'new','BARU')}
      ${statCard('Belum Ada Tanggal',d.noDate,'nodate','BELUM ADA TANGGAL')}
      ${statCard('Ada BPKB',d.withBpkb,'bpkb-yes','BPKB_ADA')}

async function fetchDashboardVehicles(){
  if(!state.dashboardFilter||state.view!=='dashboard')return;

  const requestId=state.dashboardRequestSeq;
  const target=$('dashboardVehicleTable');
  const btn=$('dashboardSearchBtn');
  if(target)target.innerHTML='<div class="empty">Memuat data kendaraan...</div>';
  if(btn){btn.disabled=true;btn.textContent='Memuat...'}
  try{
    const res=await withTimeout(server('listDashboardVehicles',state.token,{
      filter:state.dashboardFilter,page:state.dashboardPage,pageSize:10,search:state.dashboardSearch
    }),30000,'Data dashboard terlalu lama dimuat. Silakan klik Cari untuk mencoba kembali.');
    if(requestId!==state.dashboardRequestSeq)return;
    const current=$('dashboardVehicleTable');if(!current)return;
    if(!res.rows.length){current.innerHTML='<div class="empty">Data kendaraan tidak ditemukan.</div>';return}
    current.innerHTML=`<div class="table-wrap"><table class="table"><thead><tr><th>Kendaraan</th><th>Jenis</th><th>Status Penggunaan</th><th>No. Polisi</th><th>OPD</th><th>Penanggung Jawab</th><th>Status STNK</th><th>Berlaku STNK</th><th>Dokumen</th><th>Aksi</th></tr></thead><tbody>${res.rows.map(dashboardVehicleRow).join('')}</tbody></table></div>${dashboardPagination(res)}`;
  }catch(e){
    if(requestId===state.dashboardRequestSeq&&$('dashboardVehicleTable'))$('dashboardVehicleTable').innerHTML=`<div class="danger">${esc(errorText(e))}<div style="margin-top:9px"><button class="btn btn-light btn-sm" onclick="fetchDashboardVehicles()">Coba Lagi</button></div></div>`;
  }finally{
    if(requestId===state.dashboardRequestSeq&&btn){btn.disabled=false;btn.textContent='Cari'}
  }
}

function fileBox(label,id,url){return `<div class="attachment-box"><label style="font-weight:800;display:block;margin-bottom:7px">${esc(label)}</label>${url?`<a href="${esc(url)}" target="_blank">Buka file saat ini</a>`:'<span class="muted">Belum ada file</span>'}<input id="${id}" class="input" type="file" accept=".pdf,.jpg,.jpeg,.png,.webp" style="margin-top:7px"></div>`}
function inferOwnership(opd,owner){return /(^|[^a-z])desa([^a-z]|$)/i.test(String(opd||'')+' '+String(owner||''))?'DESA':'PEMDA'}
function inferVehicleType(name){const t=String(name||'').toLowerCase();if(/alat berat|excavator|ekskavator|bulldozer|wheel loader|loader|grader|vibro/.test(t))return'NON RODA';if(/roda\s*12|12\s*roda|empat\s*sumbu|4\s*sumbu/.test(t))return'RODA 12';if(/roda\s*10|10\s*roda|tronton|trailer|semi\s*trailer|tractor head|tiga\s*sumbu|3\s*sumbu/.test(t))return'RODA 10';if(/roda\s*8|8\s*roda/.test(t))return'RODA 8';if(/roda\s*6|6\s*roda|bus besar|bus sedang|dump\s*truck|dump\s*truk|truk|truck|tangki|pemadam/.test(t))return'RODA 6';if(/mini\s*bus|minibus|mobil penumpang|mobil barang|jeep|sedan|station wagon|suv|mpv|pick\s*up|pickup|double cabin|van|ambulans|ambulance|microbus|roda\s*4|4\s*roda/.test(t))return'RODA 4';if(/becak motor|bentor|roda\s*3|3\s*roda|roda tiga/.test(t))return'RODA 3';if(/sepeda motor|motor|scooter|skuter|sepeda|roda\s*2|2\s*roda/.test(t))return'RODA 2';if(/mobil|kendaraan dinas/.test(t))return'RODA 4';return'LAINNYA'}
function vehicleTypeOptions(selected){return ['RODA 2','RODA 3','RODA 4','RODA 6','RODA 8','RODA 10','RODA 12','NON RODA','LAINNYA'].map(x=>`<option value="${x}" ${selected===x?'selected':''}>${x}</option>`).join('')}
function syncVehicleType(force=false){const sel=$('vVehicleType');if(!sel)return;if(!force&&sel.dataset.manual==='1')return;sel.value=inferVehicleType($('vJenis')?.value)}
function syncVehicleOwnership(force=false){
  const sel=$('vOwnership');if(!sel)return;
  if(!force&&sel.dataset.manual==='1')return;
  sel.value=inferOwnership($('vOpd')?.value,$('vPemilik')?.value);
}
function resetVehicleOwnershipAuto(){const sel=$('vOwnership');if(!sel)return;sel.dataset.manual='0';syncVehicleOwnership(true)}
function validateNewVehicleRequired(){
  if($('vId').value)return true;
  const fields=[
    ['vJenis','Nama Barang/Jenis/Model'],['vMerk','Merk / Type'],['vOpd','OPD Terinventaris'],
    ['vKondisi','Kondisi'],['vPemilik','Nama Pemilik STNK'],['vWarna','Warna'],
    ['vPJ','Penanggung Jawab'],['vBastNo','BAST Penanggung Jawab'],
    ['vSilinder','Isi Silinder'],['vTahunPerolehan','Tahun Perolehan'],
    ['vTahunPembuatan','Tahun Pembuatan'],['vTahunPerakitan','Tahun Perakitan'],
    ['vRangka','Nomor Rangka'],['vMesin','Nomor Mesin']
  ];
  for(const [id,label] of fields){
    const el=$(id);
    if(!String(el?.value||'').trim()){
      toast(label+' wajib diisi untuk kendaraan baru.','error');
      if(el){el.focus();el.scrollIntoView({behavior:'smooth',block:'center'})}
      return false;
    }
  }
  return true;
}

function validateUploadFiles(files){
  for(const [label,file] of files){
    if(!file)continue;
    if(file.size>2*1024*1024){
      toast('File '+label+' melebihi 2 MB. Kompres atau pilih file yang lebih kecil.','error');
      return false;
    }
    const allowed=['application/pdf','image/jpeg','image/png','image/webp'];
    if(file.type&&allowed.indexOf(file.type)===-1){
      toast('Format file '+label+' harus PDF, JPG, PNG, atau WEBP.','error');
      return false;
    }
  }
  return true;
}

async function submitVehicle(){
  if(!validateNewVehicleRequired())return;
  const files=[['BPKB',$('fileBpkb').files[0]],['BAST',$('fileBast').files[0]],['STNK',$('fileStnk').files[0]],['FOTO',$('fileFoto').files[0]]];
  if(!validateUploadFiles(files))return;
  const f=id=>$(id).value;
  const payload={
    id:f('vId'),namaBarangJenisModel:f('vJenis'),merkType:f('vMerk'),opdTerinventaris:f('vOpd'),
    namaPemilikStnk:f('vPemilik'),penanggungJawab:f('vPJ'),bastPenanggungJawab:f('vBastNo'),
    kondisi:f('vKondisi'),warna:f('vWarna'),jenisKepemilikan:f('vOwnership'),jenisKendaraan:f('vVehicleType'),statusPenggunaan:f('vUsageStatus'),
    isiSilinder:f('vSilinder'),tahunPerolehan:f('vTahunPerolehan'),tahunPembuatan:f('vTahunPembuatan'),
    tahunPerakitan:f('vTahunPerakitan'),nomorRangka:f('vRangka'),nomorMesin:f('vMesin'),
    nomorPolisi:f('vPolisi'),nomorBpkb:f('vBpkbNo'),nomorBerangkasBpkb:f('vBpkbBox'),totalPembayaranPajak:f('vPajak'),
    tglTerakhirPengesahan:f('vTglPengesahan'),tglBerlakuStnk:f('vTglBerlaku')
  };
  loading(true,'Menyimpan data kendaraan...',25);
  try{
    const saved=await server('saveKendaraan',state.token,payload);
    let uploaded=0;
    const selected=files.filter(x=>x[1]);
    for(const [type,file] of selected){
      uploaded++;
      loadingStep(30+Math.round((uploaded/Math.max(1,selected.length))*45),'Mengunggah '+type+'...','Maksimum 2 MB per file.');
      const data=await readFile(file);
      await server('uploadLampiran',state.token,{vehicleId:saved.id,type,fileName:file.name,mimeType:file.type,base64:data});
    }
    loadingStep(88,'Menyegarkan data kendaraan...');
    closeModal();toast('Data kendaraan berhasil disimpan.');await fetchVehicles();refreshDashboardSilent();
  }catch(e){toast(errorText(e),'error')}finally{loading(false)}
}
function readFile(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
async function removeVehicle(id,polisi){ if(!confirm('Hapus data kendaraan '+(polisi||'')+'? Data hanya dinonaktifkan dan tidak langsung dihapus permanen.'))return; loading(true,'Menghapus data...');try{await server('deleteKendaraan',state.token,id);toast('Data dinonaktifkan.');fetchVehicles();refreshDashboardSilent()}catch(e){toast(errorText(e),'error')}finally{loading(false)} }
async function refreshDashboardSilent(){
  state.bootstrap.dashboard=null;
  if(state.view==='dashboard')loadDashboard();
}

function letterInput(label,id,value,type='text',required=false,cls='',oninput=''){
  return `<div class="field ${cls} ${required?'required':''}"><label>${esc(label)}</label><input id="${id}" class="input" type="${type}" value="${esc(value||'')}" ${required?'required':''} ${oninput?`oninput="${oninput}"`:''}></div>`;
}
function letterUploadBox(label,id,url){
  return `<div class="attachment-box"><div style="font-weight:800;margin-bottom:7px">${esc(label)}</div>${url?`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">Buka dokumen saat ini</a>`:'<span class="muted">Belum ada dokumen</span>'}<input id="${id}" class="input" type="file" accept=".pdf,.jpg,.jpeg,.png,.webp" style="margin-top:8px"></div>`;
}
function syncLetterDerived(updateNarrative=true){
  const type=$('lvVehicleType');if(type&&type.dataset.manual!=='1')type.value=inferVehicleType($('lvJenis')?.value);
  const own=$('letterOwnership');if(own&&own.dataset.manual!=='1')own.value=inferOwnership($('lvOpd')?.value,$('lvPemilik')?.value);
  if(updateNarrative&&own&&own.dataset.manual!=='1')applyNarrativeDefault();
  updateLetterReadiness();
}
function requiredLetterFields(){
  return [
    ['letterNumber','Nomor Surat'],
    ['letterDate','Tanggal Surat'],
    ['letterOfficer','Pejabat Penandatangan'],
    ['letterRecommendation','Jenis Rekomendasi'],
    ['lvPemilik','Nama Pemilik STNK'],
    ['lvPJ','Penanggung Jawab'],
    ['lvBast','BAST Penanggung Jawab'],
    ['lvBerlaku','Tanggal Berlaku STNK'],
    ['lvUsageStatus','Status Penggunaan']
  ];
}
function updateLetterReadiness(){
  const checks=requiredLetterFields().map(([id,label])=>({id,label,ok:!!String($(id)?.value||'').trim()}));
  const missing=checks.filter(x=>!x.ok).map(x=>x.label);
  const box=$('letterReadiness');if(!box)return missing;
  const items=checks.map(x=>`<div class="validation-item ${x.ok?'ok':'no'}">${x.ok?'✓':'✕'} ${esc(x.label)} — ${x.ok?'sudah terisi':'belum terisi'}</div>`).join('');
  if(missing.length){
    box.className='letter-span-4 danger';
    box.innerHTML=`<b>Tombol simpan belum dapat digunakan.</b><br>Lengkapi data yang berwarna merah berikut:<div class="validation-grid">${items}</div>`;
  }else{
    box.className='letter-span-4 success';
    box.innerHTML=`<b>Semua persyaratan sudah lengkap.</b> Surat dapat disimpan dan PDF dapat dibuat.<div class="validation-grid">${items}</div>`;
  }
  const btn=$('letterSaveBtn');
  if(btn){
    btn.disabled=missing.length>0;
    btn.title=missing.length?'Belum dapat disimpan karena: '+missing.join(', '):'Simpan surat dan buka PDF';
  }
  return missing;
}
function collectLetterVehicle(){const f=id=>$(id)?.value||'';return {namaBarangJenisModel:f('lvJenis'),merkType:f('lvMerk'),opdTerinventaris:f('lvOpd'),namaPemilikStnk:f('lvPemilik'),penanggungJawab:f('lvPJ'),bastPenanggungJawab:f('lvBast'),kondisi:f('lvKondisi'),warna:f('lvWarna'),isiSilinder:f('lvSilinder'),tahunPerolehan:f('lvTahunPerolehan'),tahunPembuatan:f('lvTahunPembuatan'),tahunPerakitan:f('lvTahunPerakitan'),nomorRangka:f('lvRangka'),nomorMesin:f('lvMesin'),nomorPolisi:f('lvPolisi'),nomorBpkb:f('lvBpkb'),totalPembayaranPajak:f('lvPajak'),tglTerakhirPengesahan:f('lvPengesahan'),tglBerlakuStnk:f('lvBerlaku'),jenisKepemilikan:f('letterOwnership'),jenisKendaraan:f('lvVehicleType'),statusPenggunaan:f('lvUsageStatus')}}

function applyNarrativeDefault(){
  const type=$('letterOwnership').value;
  if(type!=='DESA'){$('letterNarrative').value='Menerangkan bahwa kendaraan tersebut di bawah ini adalah Kendaraan Dinas Milik Pemerintah Kabupaten Wajo, dengan identitas kendaraan sebagai berikut:';return}
  const source=String($('lvPemilik')?.value||$('lvOpd')?.value||'').trim();
  const m=source.match(/\bdesa\s+([^,;()\n]{2,60})/i);
  let village=m?m[1].replace(/\b(kabupaten|kab\.?|kecamatan|kec\.?).*$/i,'').trim():source;
  if(village&&!/^desa\b/i.test(village))village='Desa '+village;
  if(!village)village='Desa';
  $('letterNarrative').value='Menerangkan bahwa kendaraan tersebut di bawah ini direkomendasikan untuk Penerbitan STNK/Plat dan BPKB '+village+' Kab. Wajo, mengacu pada Peraturan Bupati No. 3 Tahun 2017 sebagai implementasi dari Peraturan Menteri Desa dan PDT No. 4 Tahun 2017, dengan identitas kendaraan sebagai berikut:';
}
function updateReceiptNotice(){
  const box=$('receiptNotice');if(!box)return;
  const duplicate=$('letterRecommendation')?.value==='Pergantian STNK/Plat (Duplikat STNK)';
  box.className='letter-span-4 '+(duplicate?'success':'hidden');
  box.innerHTML=duplicate?'<b>Tanda Terima Pinjaman Sementara BPKB akan dibuat otomatis.</b> PDF akan berisi Surat Rekomendasi dan halaman Tanda Terima sesuai template Google Docs.':'';
}
async function submitLetter(){
  const missing=updateLetterReadiness();
  if(missing.length){
    const first=requiredLetterFields().find(([id])=>!String($(id)?.value||'').trim());
    const el=first?$(first[0]):null;
    toast('Surat belum dapat disimpan. Lengkapi: '+missing.join(', ')+'.','error');
    if(el){el.focus();el.scrollIntoView({behavior:'smooth',block:'center'})}
    return;
  }

  const uploadFiles=[
    ['BPKB',$('letterFileBpkb')?.files[0]],
    ['BAST',$('letterFileBast')?.files[0]],
    ['STNK',$('letterFileStnk')?.files[0]],
    ['FOTO',$('letterFileFoto')?.files[0]]
  ];
  if(!validateUploadFiles(uploadFiles))return;

  const payload={
    id:$('letterId').value,
    vehicleId:$('letterVehicleId').value,
    letterNumber:$('letterNumber').value,
    officerId:$('letterOfficer').value,
    letterDate:$('letterDate').value,
    recommendation:$('letterRecommendation').value,
    ownershipType:$('letterOwnership').value,
    narrative:$('letterNarrative').value,
    vehicle:collectLetterVehicle()
  };

  const previewWindow=window.open('about:blank','_blank');
  if(!previewWindow){toast('Popup diblokir browser. Izinkan popup untuk aplikasi ini.','error');return}

  loading(true,'Menyiapkan surat...',18,'Validasi data dan dokumen sedang diproses.');
  try{
    const selected=uploadFiles.filter(x=>x[1]);
    let done=0;
    for(const [type,file] of selected){
      done++;
      loadingStep(18+Math.round((done/Math.max(1,selected.length))*35),'Mengunggah dokumen '+type+'...','Maksimum 2 MB per file.');
      const data=await readFile(file);
      await server('uploadLampiran',state.token,{vehicleId:payload.vehicleId,type,fileName:file.name,mimeType:file.type,base64:data});
    }

    loadingStep(58,'Menyimpan data dan nomor surat...','Nomor surat dan Pengaturan disinkronkan otomatis.');
    const result=await server('saveSuratAndGetPdf',state.token,payload);
    if(result.pdf){
      loadingStep(94,'Membuka PDF...','Dokumen sementara Google Docs sedang dihapus otomatis.');
      const url=base64PdfUrl(result.pdf.base64,result.pdf.mimeType);
      previewWindow.location.href=url;
      previewWindow.focus();
      setTimeout(()=>URL.revokeObjectURL(url),180000);
    }
    closeModal();
    toast('Surat '+result.number+(result.updated?' berhasil diperbarui.':' berhasil dibuat.')+(result.hasReceipt?' Tanda terima BPKB ikut dibuat.':''));
    state.bootstrap.dashboard=null;
    if(state.view==='letters')await fetchLetters();
    if(state.view==='vehicles')await fetchVehicles();
    if(state.view==='dashboard')await loadDashboard();
  }catch(e){
    previewWindow.close();
    toast(errorText(e),'error');
  }finally{loading(false)}
}

async function loadLetters(){
  $('content').innerHTML=`<section class="panel" style="margin-top:0"><div class="panel-head"><div class="toolbar"><input id="letterSearch" class="input" placeholder="Cari nomor surat, polisi, rangka, mesin, OPD..." value="${esc(state.letterSearch)}"><button class="btn btn-light" onclick="applyLetterFilter()">Cari</button></div></div><div id="letterTable"><div class="empty">Memuat riwayat...</div></div></section>`;
  $('letterSearch').addEventListener('keydown',e=>{if(e.key==='Enter')applyLetterFilter()});await fetchLetters();
}
async function fetchLetters(){
  try{
    const res=await server('listSurat',state.token,{page:state.letterPage,pageSize:20,search:state.letterSearch});

function base64PdfUrl(base64,mimeType='application/pdf'){
  const binary=atob(base64);
  const bytes=new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
  return URL.createObjectURL(new Blob([bytes],{type:mimeType}));
}

async function ensureLeaflet(){
  if(window.L)return true;
  if(window.__leafletLoading)return window.__leafletLoading;
  window.__leafletLoading=new Promise(resolve=>{
    const css=document.createElement('link');css.rel='stylesheet';css.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';document.head.appendChild(css);
    const js=document.createElement('script');js.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';js.async=true;
    let done=false;const finish=v=>{if(done)return;done=true;clearTimeout(timer);resolve(v)};
    js.onload=()=>finish(!!window.L);js.onerror=()=>finish(false);document.head.appendChild(js);
    const timer=setTimeout(()=>finish(false),8000);
  });
  return window.__leafletLoading;
}

async function renderLandMap(containerId,points){
  const el=$(containerId);if(!el)return;
  const leafletReady=await ensureLeaflet();
  if(leafletReady&&window.L){
    if(landState.map){try{landState.map.remove()}catch(e){}}
    const map=L.map(containerId,{zoomControl:true}).setView([-4.15,120.03],10);landState.map=map;
    const tile=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'});
    tile.on('tileerror',()=>el.classList.add('map-offline'));tile.addTo(map);
    const bounds=[];(points||[]).forEach(p=>{if(Number.isFinite(Number(p.lat))&&Number.isFinite(Number(p.lng))){const m=L.marker([Number(p.lat),Number(p.lng)]).addTo(map);m.bindPopup(`<b>${esc(p.name||'-')}</b><br>${esc(p.opd||'-')}<br>${esc(p.status||'-')}<br>${Number(p.lat).toFixed(7)}, ${Number(p.lng).toFixed(7)}`);bounds.push([Number(p.lat),Number(p.lng)])}});
    if(bounds.length)map.fitBounds(bounds,{padding:[20,20],maxZoom:14});
    setTimeout(()=>map.invalidateSize(),50);
  }else{
    renderCoordinateFallback(el,points||[]);
  }
}

function renderCoordinateFallback(el,points){
  const valid=points.filter(p=>isFinite(Number(p.lat))&&isFinite(Number(p.lng)));
  if(!valid.length){el.innerHTML='<div class="empty">Belum ada koordinat untuk ditampilkan.</div>';return}
  const lats=valid.map(p=>Number(p.lat)),lngs=valid.map(p=>Number(p.lng));let minLa=Math.min(...lats),maxLa=Math.max(...lats),minLn=Math.min(...lngs),maxLn=Math.max(...lngs);if(minLa===maxLa){minLa-=.01;maxLa+=.01}if(minLn===maxLn){minLn-=.01;maxLn+=.01}
  const dots=valid.slice(0,1000).map(p=>{const x=20+(Number(p.lng)-minLn)/(maxLn-minLn)*760,y=380-(Number(p.lat)-minLa)/(maxLa-minLa)*340;return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4"><title>${esc(p.name||'')} — ${esc(p.opd||'')}</title></circle>`}).join('');
  el.innerHTML=`<svg viewBox="0 0 800 400" class="coordinate-svg"><rect x="0" y="0" width="800" height="400"/><g>${dots}</g><text x="20" y="25">Peta koordinat offline</text></svg>`;
}

async function loadLandList(){
  const res=await server('listTanah',state.token,landState.page,landState.pageSize,landState.search,landState.filter);landState.rows=res.rows||[];
  $('content').innerHTML=`<section class="panel"><div class="panel-head"><div><h3>Data Tanah</h3><div class="muted">${res.total||0} data ditemukan</div></div><button class="btn btn-primary" id="addLandBtn">+ Tambah Tanah</button></div>
  <div class="panel-body"><div class="toolbar"><input id="landSearch" class="input" placeholder="Cari OPD, uraian, kecamatan, desa, sertifikat" value="${esc(landState.search)}"><select id="landFilter" class="select"><option value="">Semua Status</option><option>Bersertifikat</option><option>Non-Sertifikat</option><option>Sudah Diploting</option><option>Belum Diploting</option></select><button id="landSearchBtn" class="btn btn-light">Cari</button></div></div>
  <div class="table-wrap"><table><thead><tr><th>Uraian/OPD</th><th>Lokasi</th><th>Luas</th><th>Status</th><th>Koordinat</th><th>Dokumen</th><th>Aksi</th></tr></thead><tbody>${(res.rows||[]).map(r=>landRowHtml(r)).join('')||'<tr><td colspan="7" class="empty">Data tidak ditemukan.</td></tr>'}</tbody></table></div>
  <div class="pagination"><button class="btn btn-light btn-sm" id="landPrev" ${res.page<=1?'disabled':''}>Sebelumnya</button><span>Halaman ${res.page} / ${res.pages}</span><button class="btn btn-light btn-sm" id="landNext" ${res.page>=res.pages?'disabled':''}>Berikutnya</button></div></section>`;
  $('landFilter').value=landState.filter||'';
  $('addLandBtn').onclick=()=>openLandForm();$('landSearchBtn').onclick=()=>{landState.search=$('landSearch').value;landState.filter=$('landFilter').value.toUpperCase();landState.page=1;loadLandList()};$('landSearch').onkeydown=e=>{if(e.key==='Enter')$('landSearchBtn').click()};
  $('landPrev').onclick=()=>{if(landState.page>1){landState.page--;loadLandList()}};$('landNext').onclick=()=>{if(landState.page<res.pages){landState.page++;loadLandList()}};
  document.querySelectorAll('[data-land-edit]').forEach(b=>b.onclick=()=>openLandForm(b.dataset.landEdit));
  document.querySelectorAll('[data-land-delete]').forEach(b=>b.onclick=()=>deleteLandRecord(b.dataset.landDelete));
  document.querySelectorAll('[data-land-map]').forEach(b=>b.onclick=()=>openLandPoint(b.dataset.landMap));
}

function landRowHtml(r){const docs=[r.fotoUrl?'FOTO':'',r.sertifikatUrl?'SERTIFIKAT':''].filter(Boolean).join(' + ')||'Belum ada';return `<tr><td><b>${esc(r.uraian||'-')}</b><div class="muted">${esc(r.opd||r.nama_opd||'-')} · ${esc(r.id||'')}</div></td><td>${esc(r.kecamatan||'-')}<br>${esc(r.desa||'-')}</td><td>${esc(r.luas||'-')}</td><td><span class="badge">${esc(r.status||'-')}</span><div class="muted">${esc(r.statusPloting||'')}</div></td><td>${r.lat!=null?`${Number(r.lat).toFixed(7)},<br>${Number(r.lng).toFixed(7)}`:'-'}</td><td>${esc(docs)}</td><td><div class="icon-actions"><button class="icon-btn" title="Edit" data-land-edit="${esc(r.id)}">✎</button><button class="icon-btn" title="Lihat titik" data-land-map="${esc(r.id)}">⌖</button><button class="icon-btn danger-icon" title="Hapus" data-land-delete="${esc(r.id)}">🗑</button></div></td></tr>`}

async function openLandForm(id=''){
  loading(true,id?'Memuat data tanah...':'Membuka form...');
  try{
    const d=id?await server('getTanah',state.token,id):{nama_opd:state.user.opd||'',Status:'Non-Sertifikat'};
    const body=`<div class="form-grid land-form">
      ${landInput('EID','landId',d.eid||'',true)}${landInput('Nomor Berangkas','landBox',d.no_brangkas||'')}${landInput('OPD','landOpd',d.nama_opd||'',false,true)}
      ${landInput('Uraian/Nama Aset','landName',d.uraian||'',false,false,'span-2')}${landInput('Kecamatan','landDistrict',d.kecamatan||'')}${landInput('Desa/Kelurahan','landVillage',d.desa||'')}${landInput('Alamat','landAddress',d.alamat||'',false,false,'span-2')}
      ${landInput('Luas','landArea',d.luas||'')}${landInput('Penggunaan','landUse',d.penggunaan||'')}${landInput('Nomor Bukti','landProof',d.no_bukti||'')}${landInput('Tahun','landYear',d.tahun||'')}${landInput('Harga','landPrice',d.harga||'')}
      <div class="field"><label>Status Sertifikat *</label><select id="landCert" class="select"><option>Bersertifikat</option><option>Non-Sertifikat</option></select></div>
      ${landInput('Nomor Sertifikat','landCertNo',d.NOMOR_SERTIFIKAT||'')}${landInput('Jenis Hak','landRight',d.JENIS_HAK||'')}
      ${landInput('Latitude','landLat',d.lat??'')}${landInput('Longitude','landLng',d.lng??'')}<div class="field span-2"><button type="button" class="btn btn-light" id="takeGpsBtn">⌖ Ambil GPS HP</button></div>
      <div class="field span-2"><label>Keterangan</label><textarea id="landNotes" class="textarea">${esc(d.keterangan||'')}</textarea></div>
      <div class="field"><label>Foto Tanah (maks. 2 MB)</label><input id="landPhoto" class="input" type="file" accept=".pdf,.jpg,.jpeg,.png,.webp"></div>
      <div class="field"><label>Sertifikat (maks. 2 MB)</label><input id="landCertificate" class="input" type="file" accept=".pdf,.jpg,.jpeg,.png,.webp"></div>
    </div>`;
    showModal(id?'Edit Data Tanah':'Tambah Data Tanah',body,`<button class="btn btn-light" onclick="closeModal()">Batal</button><button class="btn btn-primary" id="saveLandBtn">Simpan</button>`,'modal-lg');
    $('landCert').value=String(d.Status||'').toUpperCase().includes('NON')?'Non-Sertifikat':'Bersertifikat';
    $('takeGpsBtn').onclick=takeLandGps;$('saveLandBtn').onclick=saveLandForm;
  }catch(e){toast(errorText(e),'error')}finally{loading(false)}
}

function landInput(label,id,value,readonly=false,list=false,cls=''){return `<div class="field ${cls}"><label>${esc(label)}</label><input id="${id}" class="input" value="${esc(value??'')}" ${readonly?'readonly':''} ${list?'list="landOpdList"':''}></div>${list?`<datalist id="landOpdList">${(state.bootstrap.opds||[]).map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`:''}`}

function takeLandGps(){if(!navigator.geolocation){toast('GPS tidak didukung perangkat ini.','error');return}loading(true,'Mengambil lokasi GPS...',35);navigator.geolocation.getCurrentPosition(pos=>{loading(false);$('landLat').value=pos.coords.latitude.toFixed(7);$('landLng').value=pos.coords.longitude.toFixed(7);toast('Koordinat berhasil diambil.')},err=>{loading(false);toast('Lokasi gagal: '+err.message,'error')},{enableHighAccuracy:true,timeout:20000,maximumAge:0})}

async function saveLandForm(){
  const payload={eid:$('landId').value,no_brangkas:$('landBox').value,nama_opd:$('landOpd').value,uraian:$('landName').value,kecamatan:$('landDistrict').value,desa:$('landVillage').value,alamat:$('landAddress').value,luas:$('landArea').value,penggunaan:$('landUse').value,no_bukti:$('landProof').value,tahun:$('landYear').value,harga:$('landPrice').value,Status:$('landCert').value,NOMOR_SERTIFIKAT:$('landCertNo').value,JENIS_HAK:$('landRight').value,lat:$('landLat').value,lng:$('landLng').value,keterangan:$('landNotes').value};
  const missing=[['OPD',payload.nama_opd],['Uraian',payload.uraian],['Kecamatan',payload.kecamatan],['Desa/Kelurahan',payload.desa],['Luas',payload.luas],['Status',payload.Status]].filter(x=>!String(x[1]||'').trim()).map(x=>x[0]);if(missing.length){toast('Wajib diisi: '+missing.join(', '),'error');return}
  loading(true,'Menyimpan data tanah...',25);
  try{
    let result;
    if(!navigator.onLine){queueLandOffline(payload);toast('Perangkat offline. Data disimpan di antrean sinkronisasi.');closeModal();return}
    result=await server('saveTanah',state.token,payload);const id=result.id;
    for(const [inputId,type] of [['landPhoto','FOTO'],['landCertificate','SERTIFIKAT']]){const f=$(inputId).files[0];if(f){if(f.size>2*1024*1024)throw new Error(type+' maksimal 2 MB.');loadingStep(60,'Mengunggah '+type+'...');await server('uploadDokumenTanah',state.token,id,type,{name:f.name,mimeType:f.type,base64:await readFile(f)})}}
    closeModal();toast('Data tanah berhasil disimpan.');await loadLandList();
  }catch(e){toast(errorText(e),'error')}finally{loading(false)}
}

async function deleteLandRecord(id){if(!confirm('Hapus data tanah ini?'))return;loading(true,'Menghapus data...');try{await server('deleteTanah',state.token,id);toast('Data tanah dihapus.');await loadLandList()}catch(e){toast(errorText(e),'error')}finally{loading(false)}}
async function openLandPoint(id){try{const d=await server('getTanah',state.token,id);if(d.lat==null||d.lng==null)throw new Error('Koordinat belum tersedia.');showModal('Lokasi Aset Tanah',`<div id="singleLandMap" class="land-map"></div><div style="margin-top:8px"><b>${esc(d.uraian||'')}</b><br>${esc(d.nama_opd||'')}<br>${Number(d.lat).toFixed(7)}, ${Number(d.lng).toFixed(7)}</div>`,`<button class="btn btn-light" onclick="closeModal()">Tutup</button>`,'modal-lg');setTimeout(()=>renderLandMap('singleLandMap',[{name:d.uraian,opd:d.nama_opd,status:d.Status,lat:d.lat,lng:d.lng}]),50)}catch(e){toast(errorText(e),'error')}}

async function loadLandMapPage(){const d=await server('getDashboard',state.token);$('content').innerHTML=`<section class="panel"><div class="panel-head"><h3>Peta & Ploting</h3><button class="btn btn-primary" id="newLandPlot">+ Tambah Ploting</button></div><div class="panel-body"><div id="fullLandMap" class="land-map land-map-large"></div><div class="muted" style="margin-top:8px">Peta online memakai OpenStreetMap. Saat offline, koordinat dan titik aset yang sudah dimuat tetap dapat dilihat melalui tampilan koordinat cadangan.</div></div></section>`;$('newLandPlot').onclick=()=>openLandForm();renderLandMap('fullLandMap',d.points||[])}

function getLandQueue(){try{return JSON.parse(localStorage.getItem('v17_land_queue')||'[]')}catch(e){return []}}
function saveLandQueue(q){try{localStorage.setItem('v17_land_queue',JSON.stringify(q))}catch(e){}}
function queueLandOffline(payload){const q=getLandQueue();payload.SYNC_ID=payload.SYNC_ID||('OFF-'+Date.now()+'-'+Math.random().toString(16).slice(2));q.push(payload);saveLandQueue(q)}
function renderLandSync(){const q=getLandQueue();$('content').innerHTML=`<section class="panel"><div class="panel-head"><h3>Sinkronisasi Data Tanah</h3></div><div class="panel-body"><div class="cards"><div class="card"><span>Antrean Offline</span><strong>${q.length}</strong></div><div class="card"><span>Status Jaringan</span><strong>${navigator.onLine?'ONLINE':'OFFLINE'}</strong></div></div><button class="btn btn-primary" id="syncLandNow" ${!q.length?'disabled':''}>⇄ Sinkronkan Sekarang</button><div id="syncLandInfo" class="muted" style="margin-top:10px">Data offline hanya dihapus setelah server menyatakan berhasil.</div></div></section>`;$('syncLandNow').onclick=syncLandQueue}
async function syncLandQueue(){const q=getLandQueue();if(!q.length)return;if(!navigator.onLine){toast('Perangkat masih offline.','error');return}loading(true,'Menyinkronkan data...',25);try{const r=await server('syncTanahOffline',state.token,q);if(r.failed&&r.failed.length){const failedIndexes=new Set(r.failed.map(x=>x.index));saveLandQueue(q.filter((_,i)=>failedIndexes.has(i)));toast(`${r.ok} berhasil, ${r.failed.length} gagal.`,'error')}else{saveLandQueue([]);toast(`${r.ok} data berhasil disinkronkan.`)}renderLandSync()}catch(e){toast(errorText(e),'error')}finally{loading(false)}}
window.addEventListener('online',()=>{if(state.asset==='TANAH'&&state.token&&getLandQueue().length)syncLandQueue().catch(()=>{})});

</script>
